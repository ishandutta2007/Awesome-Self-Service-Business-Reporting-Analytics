<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#0a0e17"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="subGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#cbd5e1"/></linearGradient><linearGradient id="barGrad1" x1="0%" x2="0%" y1="100%" y2="0%"><stop offset="0%" stop-color="#0284c7" stop-opacity=".3"/><stop offset="100%" stop-color="#38bdf8" stop-opacity=".8"/></linearGradient><linearGradient id="barGrad2" x1="0%" x2="0%" y1="100%" y2="0%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".3"/><stop offset="100%" stop-color="#818cf8" stop-opacity=".8"/></linearGradient><linearGradient id="lineGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#34d399"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".5" stroke-width=".8" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity=".25"/></pattern><style>@keyframes drawLine{0%{stroke-dashoffset:1200}}@keyframes pulseOrb{0%{transform:scale(.9) translate(0,0);opacity:.25}50%{transform:scale(1.1) translate(20px,-15px);opacity:.45}}@keyframes nodeBlink{0%{r:4px;opacity:.6}50%{r:7px;opacity:1;filter:drop-shadow(0 0 8px #38bdf8)}}@keyframes floatCard{0%{transform:translateY(0)}}@keyframes floatCardRev{0%{transform:translateY(0)}}@keyframes barGrow{0%{transform:scaleY(.7)}}.bg-pulse{animation:pulseOrb 8s ease-in-out infinite alternate}.wave-line{stroke-dasharray:1200;stroke-dashoffset:1200;animation:drawLine 6s ease-in-out infinite alternate}.node-pulse{animation:nodeBlink 3s ease-in-out infinite}.floating-card{animation:floatCard 6s ease-in-out infinite alternate}.floating-card-rev{animation:floatCardRev 7s ease-in-out infinite alternate}.bar-bounce{transform-origin:bottom;animation:barGrow 4s ease-in-out infinite alternate}.font-sub,.font-title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.font-title{font-weight:800;letter-spacing:-.5px}.font-sub{font-weight:400}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="360" fill="url(#grid)" rx="16"/><circle cx="200" cy="80" r="140" fill="#38bdf8" class="bg-pulse" filter="url(#glow)"/><circle cx="1020" cy="260" r="160" fill="#818cf8" class="bg-pulse" filter="url(#glow)" style="animation-delay:-3s"/><circle cx="600" cy="180" r="100" fill="#c084fc" class="bg-pulse" filter="url(#glow)" style="animation-delay:-5s"/><g opacity=".35"><path fill="none" stroke="url(#lineGrad)" stroke-width="3" d="M 0 280 Q 250 160 500 240 T 950 180 T 1200 220" class="wave-line"/><path fill="none" stroke="url(#lineGrad)" stroke-width="2" d="M 0 310 Q 300 220 600 290 T 1000 210 T 1200 260" class="wave-line" style="animation-delay:-2s"/></g><g class="floating-card" opacity=".85" transform="translate(60, 60)"><rect width="170" height="115" fill="#1e293b" fill-opacity=".6" stroke="#334155" stroke-width="1.2" filter="url(#softGlow)" rx="12"/><circle cx="24" cy="22" r="5" fill="#38bdf8"/><text x="36" y="26" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">ANALYTICS KPI</text><text x="22" y="58" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="bold">+148.5%</text><path fill="none" stroke="#38bdf8" stroke-linecap="round" stroke-width="2.5" d="M 22 95 L 50 82 L 80 90 L 110 70 L 145 62"/><circle cx="145" cy="62" r="4" fill="#38bdf8" class="node-pulse"/></g><g class="floating-card-rev" opacity=".85" transform="translate(970, 70)"><rect width="170" height="120" fill="#1e293b" fill-opacity=".6" stroke="#334155" stroke-width="1.2" filter="url(#softGlow)" rx="12"/><circle cx="24" cy="22" r="5" fill="#a855f7"/><text x="36" y="26" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">QUERY ENGINE</text><g transform="translate(25, 100)"><rect width="16" height="30" x="0" y="-30" fill="url(#barGrad1)" class="bar-bounce" rx="3" style="animation-delay:0s"/><rect width="16" height="55" x="25" y="-55" fill="url(#barGrad2)" class="bar-bounce" rx="3" style="animation-delay:-.8s"/><rect width="16" height="40" x="50" y="-40" fill="url(#barGrad1)" class="bar-bounce" rx="3" style="animation-delay:-1.6s"/><rect width="16" height="70" x="75" y="-70" fill="url(#barGrad2)" class="bar-bounce" rx="3" style="animation-delay:-2.4s"/><rect width="16" height="50" x="100" y="-50" fill="url(#barGrad1)" class="bar-bounce" rx="3" style="animation-delay:-3.2s"/></g></g><g id="foreground-content"><g transform="translate(435, 45)"><rect width="330" height="32" fill="#1e293b" fill-opacity=".9" stroke="#38bdf8" stroke-width="1.2" filter="url(#softGlow)" rx="16"/><circle cx="20" cy="16" r="5" fill="#10b981"/><text x="34" y="21" fill="#e2e8f0" font-family="sans-serif" font-size="12.5" font-weight="600" letter-spacing="1">CURATED DATA &amp; BI STACK</text></g><text x="600" y="145" fill="url(#titleGrad)" class="font-title" filter="url(#softGlow)" font-size="36" text-anchor="middle">Awesome Self-Service Business Reporting &amp; Analytics</text><text x="600" y="195" fill="url(#subGrad)" class="font-sub" font-size="17" text-anchor="middle">The definitive index of modern BI platforms, SQL-free exploration engines &amp; open-source dashboard tools</text><g><g transform="translate(250, 245) translate(0, 0)"><rect width="180" height="38" fill="#0f172a" fill-opacity=".95" stroke="#3b82f6" stroke-width="1.3" rx="19"/><text x="90" y="24" fill="#93c5fd" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">🏢 Enterprise SaaS</text></g><g transform="translate(250, 245) translate(200, 0)"><rect width="170" height="38" fill="#0f172a" fill-opacity=".95" stroke="#10b981" stroke-width="1.3" rx="19"/><text x="85" y="24" fill="#6ee7b7" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">⚡ Open Source</text></g><g transform="translate(250, 245) translate(390, 0)"><rect width="180" height="38" fill="#0f172a" fill-opacity=".95" stroke="#8b5cf6" stroke-width="1.3" rx="19"/><text x="90" y="24" fill="#c4b5fd" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">📊 Visual Dashboards</text></g><g transform="translate(250, 245) translate(590, 0)"><rect width="170" height="38" fill="#0f172a" fill-opacity=".95" stroke="#f59e0b" stroke-width="1.3" rx="19"/><text x="85" y="24" fill="#fcd34d" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">🧠 Semantic Models</text></g></g><text x="600" y="325" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="middle">⚡ Actively Maintained • Star-Ranked Open-Source Tools • Verified Tier Pricing &amp; Market Dynamics</text></g></svg>