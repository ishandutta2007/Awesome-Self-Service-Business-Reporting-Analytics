<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0a0e17" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <style>
      .bg-pulse {
        animation: pulseOrb 8s ease-in-out infinite alternate;
      }
      .wave-line {
        stroke-dasharray: 1200;
        stroke-dashoffset: 1200;
        animation: drawLine 6s ease-in-out infinite alternate;
      }
      .node-pulse {
        animation: nodeBlink 3s ease-in-out infinite;
      }
      .floating-card {
        animation: floatCard 6s ease-in-out infinite alternate;
      }
      .floating-card-rev {
        animation: floatCardRev 7s ease-in-out infinite alternate;
      }
      .bar-bounce {
        transform-origin: bottom;
        animation: barGrow 4s ease-in-out infinite alternate;
      }
      @keyframes drawLine {
        0% { stroke-dashoffset: 1200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseOrb {
        0% { transform: scale(0.9) translate(0, 0); opacity: 0.25; }
        50% { transform: scale(1.1) translate(20px, -15px); opacity: 0.45; }
        100% { transform: scale(0.95) translate(-15px, 10px); opacity: 0.3; }
      }
      @keyframes nodeBlink {
        0%, 100% { r: 4px; opacity: 0.6; }
        50% { r: 7px; opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
      }
      @keyframes floatCard {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-12px); }
      }
      @keyframes floatCardRev {
        0% { transform: translateY(0px); }
        100% { transform: translateY(10px); }
      }
      @keyframes barGrow {
        0% { transform: scaleY(0.7); }
        100% { transform: scaleY(1.05); }
      }
      .font-title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .font-sub {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Ambient Glowing Orbs in Background -->
  <circle cx="200" cy="80" r="140" fill="#38bdf8" filter="url(#glow)" class="bg-pulse" />
  <circle cx="1020" cy="260" r="160" fill="#818cf8" filter="url(#glow)" class="bg-pulse" style="animation-delay: -3s;" />
  <circle cx="600" cy="180" r="100" fill="#c084fc" filter="url(#glow)" class="bg-pulse" style="animation-delay: -5s;" />

  <!-- Subtle Animated Wave Charts (Data flow in background) -->
  <g opacity="0.35">
    <path class="wave-line" d="M 0 280 Q 250 160 500 240 T 950 180 T 1200 220" fill="none" stroke="url(#lineGrad)" stroke-width="3" />
    <path class="wave-line" d="M 0 310 Q 300 220 600 290 T 1000 210 T 1200 260" fill="none" stroke="url(#lineGrad)" stroke-width="2" style="animation-delay: -2s;" />
  </g>

  <!-- Left Dynamic Mini Dashboard Card (Animated floating) -->
  <g class="floating-card" transform="translate(60, 60)" opacity="0.85">
    <rect width="170" height="115" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1.2" filter="url(#softGlow)" />
    <circle cx="24" cy="22" r="5" fill="#38bdf8" />
    <text x="36" y="26" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="600">ANALYTICS KPI</text>
    <text x="22" y="58" fill="#f8fafc" font-size="22" font-family="sans-serif" font-weight="bold">+148.5%</text>
    <!-- Mini Sparkline -->
    <path d="M 22 95 L 50 82 L 80 90 L 110 70 L 145 62" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="145" cy="62" r="4" fill="#38bdf8" class="node-pulse" />
  </g>

  <!-- Right Dynamic Data Bars Card (Animated floating) -->
  <g class="floating-card-rev" transform="translate(970, 70)" opacity="0.85">
    <rect width="170" height="120" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1.2" filter="url(#softGlow)" />
    <circle cx="24" cy="22" r="5" fill="#a855f7" />
    <text x="36" y="26" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="600">QUERY ENGINE</text>
    <!-- Bar chart visualization -->
    <g transform="translate(25, 100)">
      <rect x="0" y="-30" width="16" height="30" rx="3" fill="url(#barGrad1)" class="bar-bounce" style="animation-delay: 0s;" />
      <rect x="25" y="-55" width="16" height="55" rx="3" fill="url(#barGrad2)" class="bar-bounce" style="animation-delay: -0.8s;" />
      <rect x="50" y="-40" width="16" height="40" rx="3" fill="url(#barGrad1)" class="bar-bounce" style="animation-delay: -1.6s;" />
      <rect x="75" y="-70" width="16" height="70" rx="3" fill="url(#barGrad2)" class="bar-bounce" style="animation-delay: -2.4s;" />
      <rect x="100" y="-50" width="16" height="50" rx="3" fill="url(#barGrad1)" class="bar-bounce" style="animation-delay: -3.2s;" />
    </g>
  </g>

  <!-- Foreground Title and Subtitle (Guaranteed in foreground with high contrast) -->
  <g id="foreground-content">
    <!-- Category Pill Badge -->
    <g transform="translate(435, 45)">
      <rect width="330" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" filter="url(#softGlow)" />
      <circle cx="20" cy="16" r="5" fill="#10b981" />
      <text x="34" y="21" fill="#e2e8f0" font-size="12.5" font-family="sans-serif" font-weight="600" letter-spacing="1">CURATED DATA &amp; BI STACK</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" fill="url(#titleGrad)" class="font-title" font-size="36" filter="url(#softGlow)">
      Awesome Self-Service Business Reporting &amp; Analytics
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" text-anchor="middle" fill="url(#subGrad)" class="font-sub" font-size="17">
      The definitive index of modern BI platforms, SQL-free exploration engines &amp; open-source dashboard tools
    </text>

    <!-- Feature Tags / Metric Pills -->
    <g transform="translate(250, 245)">
      <!-- Pill 1: Enterprise SaaS -->
      <g transform="translate(0, 0)">
        <rect width="180" height="38" rx="19" fill="#0f172a" fill-opacity="0.95" stroke="#3b82f6" stroke-width="1.3" />
        <text x="90" y="24" text-anchor="middle" fill="#93c5fd" font-size="13.5" font-family="sans-serif" font-weight="600">🏢 Enterprise SaaS</text>
      </g>
      <!-- Pill 2: Open Source BI -->
      <g transform="translate(200, 0)">
        <rect width="170" height="38" rx="19" fill="#0f172a" fill-opacity="0.95" stroke="#10b981" stroke-width="1.3" />
        <text x="85" y="24" text-anchor="middle" fill="#6ee7b7" font-size="13.5" font-family="sans-serif" font-weight="600">⚡ Open Source</text>
      </g>
      <!-- Pill 3: Visual Dashboards -->
      <g transform="translate(390, 0)">
        <rect width="180" height="38" rx="19" fill="#0f172a" fill-opacity="0.95" stroke="#8b5cf6" stroke-width="1.3" />
        <text x="90" y="24" text-anchor="middle" fill="#c4b5fd" font-size="13.5" font-family="sans-serif" font-weight="600">📊 Visual Dashboards</text>
      </g>
      <!-- Pill 4: Semantic Layers -->
      <g transform="translate(590, 0)">
        <rect width="170" height="38" rx="19" fill="#0f172a" fill-opacity="0.95" stroke="#f59e0b" stroke-width="1.3" />
        <text x="85" y="24" text-anchor="middle" fill="#fcd34d" font-size="13.5" font-family="sans-serif" font-weight="600">🧠 Semantic Models</text>
      </g>
    </g>

    <!-- Bottom Status Line -->
    <text x="600" y="325" text-anchor="middle" fill="#64748b" font-size="12" font-family="sans-serif" font-weight="500">
      ⚡ Actively Maintained • Star-Ranked Open-Source Tools • Verified Tier Pricing &amp; Market Dynamics
    </text>
  </g>
</svg>
